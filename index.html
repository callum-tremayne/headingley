<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Existing listener for the offers container toggling
    var offersContainer = document.querySelector(".offers-container");
    var offersHeader = offersContainer.querySelector(".offers-header");

    offersHeader.addEventListener("click", function (e) {
      // Prevent the document click event from immediately closing the dropdown
      e.stopPropagation();
      // Toggle the active state
      offersContainer.classList.toggle("active");
      var dropdown = offersContainer.querySelector(".offers-dropdown");
      if (dropdown.style.maxHeight && dropdown.style.maxHeight !== "0px") {
        dropdown.style.maxHeight = null;
      } else {
        dropdown.style.maxHeight = dropdown.scrollHeight + "px";
      }
    });

    // Listen for clicks anywhere in the document.
    document.addEventListener("click", function (e) {
      // If the click target is not within the offers container,
      // then close the dropdown.
      if (!offersContainer.contains(e.target)) {
        offersContainer.classList.remove("active");
        var dropdown = offersContainer.querySelector(".offers-dropdown");
        if (dropdown) {
          dropdown.style.maxHeight = null;
        }
      }
    });
  });
</script>
